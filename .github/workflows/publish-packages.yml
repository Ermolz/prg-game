# Publish CLI packages:
# - when a release is published (version = tag)
# - when push to branch 'ui' (version = 1.0.0-ci.<run_number>)
# C# → GitHub Packages (NuGet), Java → GitHub Packages (Maven), Python → PyPI, Prolog → artifact (zip)
name: Publish packages

on:
  release:
    types: [published]
  push:
    branches: [ui]

env:
  PACKAGE_VERSION: ${{ github.event.release.tag_name || format('1.0.0-ci.{0}', github.run_number) }}

jobs:
  publish-csharp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set version (strip v prefix)
        run: echo "VERSION=${PACKAGE_VERSION#v}" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Pack NuGet
        run: |
          mkdir -p out/nuget
          cd src/csharp/DotsAndBoxes.Cli
          dotnet pack -c Release -o ../../../out/nuget -p:Version=${{ env.VERSION }}
      - name: Push to GitHub Packages (NuGet)
        run: |
          cd out/nuget
          dotnet nuget push "*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

  publish-java:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version (strip v prefix)
        run: echo "VERSION=${PACKAGE_VERSION#v}" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Publish to GitHub Packages (Maven)
        run: |
          JAVADIR="src/java"
          [ ! -f "$JAVADIR/build.gradle.kts" ] && JAVADIR="game/src/java"
          cd "$JAVADIR"
          gradle shadowJar publish -Pversion=${{ env.VERSION }}

  publish-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version (strip v prefix)
        run: echo "VERSION=${PACKAGE_VERSION#v}" >> $GITHUB_ENV
      - name: Set PEP 440 version for Python
        run: |
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-ci\.[0-9]+$'; then
            echo "PYTHON_VERSION=${VERSION/-ci./.dev}" >> $GITHUB_ENV
          else
            echo "PYTHON_VERSION=$VERSION" >> $GITHUB_ENV
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel and sdist
        run: |
          PYDIR="src/python"
          [ ! -f "$PYDIR/pyproject.toml" ] && PYDIR="game/src/python"
          sed -i "s/^version = .*/version = \"${{ env.PYTHON_VERSION }}\"/" "$PYDIR/pyproject.toml"
          cd "$PYDIR" && python -m build
          mkdir -p "$GITHUB_WORKSPACE/out/python-dist" && cp -r dist/* "$GITHUB_WORKSPACE/out/python-dist/"
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload out/python-dist/* -r pypi --skip-existing
      - name: Upload Python dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dab-cli-python-dist
          path: out/python-dist/

  package-prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version (strip v prefix)
        run: echo "VERSION=${PACKAGE_VERSION#v}" >> $GITHUB_ENV
      - name: Zip Prolog CLI
        run: |
          mkdir -p out
          cd src/prolog
          zip -r ../../out/dab-cli-prolog-${{ env.VERSION }}.zip . -i "*.pl"
          cd ../..
      - name: Upload Prolog zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: dab-cli-prolog
          path: out/dab-cli-prolog-${{ env.VERSION }}.zip
